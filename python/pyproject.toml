[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qalab"
version = "0.1.0"
description = "Miaw QA Lab: AI-assisted triage and vision tools for Unity playtests"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "jsonschema[format]>=4.21",
  "rich>=13.7",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "httpx>=0.27",
  "jinja2>=3.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
vision = ["opencv-python-headless>=4.9", "pillow>=10.3"]

[project.scripts]
qalab = "qalab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qalab = ["prompts/*.md", "report/templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
