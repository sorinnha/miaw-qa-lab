# Miaw QA Lab tool config (spec 02 §12). CLI flags and QALAB_* env vars override these.
[triage]
min_level = "warning"
cell_size_m = 4.0
dbscan_eps_m = 3.0
max_reports = 25
context_chars = 10000

[triage.merge]
frame_tfidf_threshold = 0.5
frame_embed_threshold = 0.80
tfidf_only_threshold = 0.8

[rank]
p1 = 15.0
p2 = 8.0
p3 = 3.0
crash_multiplier = 1.25

[llm]
provider = "ollama"          # overridden by QALAB_PROVIDER / --provider
temperature = 0.0
max_retries = 2

[rag]
chunk_chars = 800
overlap_chars = 100
top_k = 3
min_score = 0.25
tfidf_min_score = 0.1        # --provider none: TF-IDF cosines run lower than embeddings
