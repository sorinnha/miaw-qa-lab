# Miaw QA Lab tool config (spec 02 §12). CLI flags and QALAB_* env vars override these.
[triage]
min_level = "warning"
cell_size_m = 4.0
dbscan_eps_m = 3.0
max_reports = 25
context_chars = 10000

[triage.merge]
frame_tfidf_threshold = 0.5
frame_embed_threshold = 0.80
tfidf_only_threshold = 0.8

[rank]
p1 = 15.0
p2 = 8.0
p3 = 3.0
crash_multiplier = 1.25

[llm]
# Sora's PC has no Ollama, so the hosted Gemini API is the configured provider (DECISIONS D-021).
# Needs GEMINI_API_KEY in .env and the [gemini] extra. Send sandbox data only (README, Data handling).
# Precedence: --provider > QALAB_PROVIDER > this file. model/embed_model apply to this provider only;
# QALAB_MODEL / QALAB_EMBED_MODEL and --model override them.
provider = "gemini"
model = "gemini-2.5-flash"
embed_model = "gemini-embedding-001"
temperature = 0.0
max_retries = 2

[rag]
chunk_chars = 800
overlap_chars = 100
top_k = 3
min_score = 0.25
tfidf_min_score = 0.1        # --provider none: TF-IDF cosines run lower than embeddings

[vision]
# qalab vision analyze: heuristic (free, offline) | vlm | ml | hybrid (spec 03).
method = "heuristic"
hybrid_every_n = 5           # hybrid: call the VLM on every Nth frame the heuristics passed ...
hybrid_window_s = 2.0        # ... and on frames within this many seconds of a UI action or detector event
# cost_per_1k_images = 0.0   # fill in from your provider's pricing page; left out = no cost column
