name: python-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Windows runners pipe stdout as cp1252; UTF-8 mode keeps rich output and the smoke
      # script's decoding identical on both OSes.
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: pip install -e "./python[dev]"

      - name: CLI entry point
        run: qalab --help

      # scripts/ is linted with the same config as the package (spec 04 names only python/;
      # see docs/DECISIONS.md D-016).
      - name: Lint
        run: |
          ruff check python
          ruff check scripts --config python/pyproject.toml

      - name: Format
        run: |
          ruff format --check python
          ruff format --check scripts --config python/pyproject.toml

      - name: Tests
        run: pytest python -q --cov=qalab --cov-report=xml --cov-report=term

      - name: Smoke (validate + triage with FakeProvider)
        run: python scripts/ci_smoke.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci_report-${{ matrix.os }}
          path: out/ci_report
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore

  csharp-check:
    # Engine-free package code compiled like Unity (netstandard2.1, C# 9) and its EditMode tests
    # run outside Unity (spec 04, D-006). YOU WRITE tests are excluded until Sora writes them.
    name: csharp-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test tools/cs-check -c Release --filter "TestCategory!=YouWrite"
